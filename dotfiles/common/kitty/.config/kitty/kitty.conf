cursor_trail 10
cursor_trail_start_threshold 0
cursor_trail_decay 0.01 0.05

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
symbol_map U+1F000-U+1FAFF Noto Color Emoji
# END_KITTY_FONTS

font_size 12


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
